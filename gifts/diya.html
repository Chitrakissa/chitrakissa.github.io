<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ek diya, aapke naam · Chitrakissa</title>
<meta name="description" content="A diya lit in your name this Diwali. Tap to light it.">
<meta property="og:title" content="Ek diya, aapke naam 🪔">
<meta property="og:description" content="Someone lit a diya for you this Diwali. Tap to light it.">
<meta property="og:image" content="diya/door_north.jpg">
<meta name="theme-color" content="#0b0912">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Kalam:wght@400;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Ek diya, aapke naam — a Diwali greeting you open by lighting a lamp. Darkness and one diya on a painted threshold; a tap lights it, the light
   travels from lamp to lamp, the doorway (with its own rangoli, kolam or alpana) fills with light, the greeting rises in their language,
   sparks rise from the flames; then a phuljhadi to draw with. Everything visible comes from the link (#g=…) or the defaults; text goes in with textContent. */
:root { --night: #0b0912; --cream: #fbf2e2; --gold: #f3c26b; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream); overflow: hidden; font-family: "Cormorant Garamond", Georgia, serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; text-align: center; padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
.top { transition: opacity 1.2s, transform 1.2s; }
.top.away { opacity: 0; transform: translateY(-10px); }
.eyebrow { font: 600 12px/1 "Karla", system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); opacity: .85; }
.for { font: italic 500 clamp(26px, 7vw, 40px)/1.15 "Cormorant Garamond", serif; margin-top: 12px; text-shadow: 0 2px 20px rgba(0, 0, 0, .8); }
.from { font: 400 18px "Kalam", cursive; color: #e9d7b6; margin-top: 6px; text-shadow: 0 2px 14px rgba(0, 0, 0, .9); }
.greet { position: fixed; left: 0; right: 0; top: max(26px, env(safe-area-inset-top)); padding: 0 18px; opacity: 0; transform: translateY(12px); transition: opacity 1.6s, transform 1.6s; }
.greet.on { opacity: 1; transform: none; }
.g1 { font-size: clamp(40px, 12vw, 76px); line-height: 1.15; color: #fff3d6; text-shadow: 0 0 28px rgba(255, 170, 60, .55), 0 2px 18px rgba(0, 0, 0, .9); }
.verse { font: 500 clamp(18px, 4.6vw, 24px)/1.4 "Tiro Devanagari Hindi", serif; color: var(--gold); margin-top: 14px; text-shadow: 0 2px 14px rgba(0, 0, 0, .95); }
.verse small { display: block; font: italic 500 clamp(15px, 3.8vw, 18px) "Cormorant Garamond", serif; color: #e9d7b6; margin-top: 2px; }
.msg { font: 400 clamp(18px, 4.6vw, 22px)/1.35 "Kalam", cursive; color: #fff3d6; margin-top: 12px; text-shadow: 0 2px 14px rgba(0, 0, 0, .95); }
.sign { font: 700 clamp(20px, 5vw, 26px) "Kalam", cursive; color: #fff3d6; margin-top: 6px; text-shadow: 0 2px 14px rgba(0, 0, 0, .95); }
.hint { position: fixed; left: 0; right: 0; text-align: center; font: italic 500 20px "Cormorant Garamond", serif; color: #f6e2bd; pointer-events: none; transition: opacity .8s; text-shadow: 0 2px 12px #000; }
.hint b { font-weight: 500; animation: breathe 2.2s ease-in-out infinite; display: inline-block; }
@keyframes breathe { 50% { opacity: .45; } }
.end { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px; opacity: 0; transition: opacity 1s; pointer-events: none; }
.end.on { opacity: 1; pointer-events: auto; }
.end a, .end button { font: 600 14px/1 "Karla", system-ui, sans-serif; letter-spacing: .04em; padding: 12px 16px; border-radius: 999px; border: 1px solid rgba(251, 242, 226, .4); background: rgba(11, 9, 18, .55); color: var(--cream); text-decoration: none; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.end .main { background: var(--gold); color: #2a1a05; border-color: var(--gold); }
.mute { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(251, 242, 226, .3); background: rgba(11, 9, 18, .5); color: var(--cream); font-size: 16px; cursor: pointer; opacity: 0; transition: opacity .8s; }
.mute.on { opacity: .8; }
</style>
</head>
<body>
<canvas id="c" aria-label="A painted doorway at night with clay diyas on its threshold"></canvas>
<div class="ui">
  <div class="top" id="top"><div class="eyebrow">Ek diya, aapke naam</div><div class="for" id="for"></div><div class="from" id="from"></div></div>
  <div class="greet" id="greet"><div class="g1" id="g1"></div><div class="verse" id="verse"></div><div class="msg" id="msg"></div><div class="sign" id="sign"></div></div>
</div>
<div class="hint" id="hint"><b>Tap the diya to light it</b></div>
<button class="mute" id="mute" type="button" aria-label="Music on or off">♪</button>
<div class="end" id="end"><a class="main" id="make" href="../gifts.html#make-diya">🪔 Light a diya for someone</a><button type="button" id="again">Light it again</button></div>
<script id="giftConfig" type="application/json">
{ "to": "the Sharma family", "from": "Riya", "lang": "hi", "region": "north", "msg": "" }
</script>
<script>
(() => {
/* ---------- the greeting, from the link (#g=<base64url JSON>) over the defaults ---------- */
const DEF = JSON.parse(document.getElementById('giftConfig').textContent);
const fromLink = (() => { try { const m = location.hash.match(/^#g=([A-Za-z0-9_-]+)/); if (!m) return {}; return JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return {}; } })();
const C = Object.assign({}, DEF, ...['to', 'from', 'lang', 'region', 'msg'].filter(k => typeof fromLink[k] === 'string').map(k => ({ [k]: fromLink[k].slice(0, k === 'msg' ? 120 : 40) })));
// the greeting in each language (and the font it is set in); the verse stays in Sanskrit with its meaning
const LANG = {
  hi: ['शुभ दीपावली', 'Tiro Devanagari Hindi'], en: ['Happy Diwali', 'Kalam'], mr: ['दिवाळीच्या हार्दिक शुभेच्छा', 'Tiro Devanagari Marathi'],
  bn: ['শুভ দীপাবলি', 'Tiro Bangla'], ta: ['தீபாவளி நல்வாழ்த்துக்கள்', 'Tiro Tamil'], te: ['దీపావళి శుభాకాంక్షలు', 'Tiro Telugu'],
  kn: ['ದೀಪಾವಳಿ ಹಬ್ಬದ ಶುಭಾಶಯಗಳು', 'Tiro Kannada'], gu: ['શુભ દીપાવલી', 'Noto Serif Gujarati'], pa: ['ਦੀਵਾਲੀ ਦੀਆਂ ਲੱਖ ਲੱਖ ਵਧਾਈਆਂ', 'Tiro Gurmukhi'],
  ml: ['ദീപാവലി ആശംസകൾ', 'Noto Serif Malayalam'],
};
const [GREET, GFONT] = LANG[C.lang] || LANG.hi;
const REGION = ['north', 'east', 'west', 'south'].includes(C.region) ? C.region : 'north';
if (!['Tiro Devanagari Hindi', 'Kalam'].includes(GFONT)) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `https://fonts.googleapis.com/css2?family=${GFONT.replace(/ /g, '+')}&display=swap`; document.head.appendChild(l); }
const $ = id => document.getElementById(id);
$('for').textContent = 'For ' + C.to; $('from').textContent = C.from ? 'with love, from ' + C.from : '';
$('g1').textContent = GREET; $('g1').style.fontFamily = `"${GFONT}", serif`;
$('verse').textContent = 'तमसो मा ज्योतिर्गमय'; const sm = document.createElement('small'); sm.textContent = 'Lead me from darkness to light · Brihadaranyaka Upanishad'; $('verse').appendChild(sm);
$('msg').textContent = C.msg || ''; $('sign').textContent = C.from ? '— ' + C.from : '';
document.title = `For ${C.to} · Ek diya, aapke naam`;
function fitGreeting() {   // long greetings (Tamil, Marathi) shrink until every word fits the screen
  const el = $('g1'); el.style.fontSize = ''; let size = parseFloat(getComputedStyle(el).fontSize);
  const words = GREET.split(' '), probe = document.createElement('span'); probe.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-family:"${GFONT}",serif`; document.body.appendChild(probe);
  const room = Math.min(innerWidth - 36, 700), widest = () => Math.max(...words.map(w => { probe.textContent = w; probe.style.fontSize = size + 'px'; return probe.offsetWidth; }));
  while (widest() > room && size > 22) size -= 2; el.style.fontSize = size + 'px'; probe.remove();
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fitGreeting); addEventListener('resize', fitGreeting); setTimeout(fitGreeting, 1500);

/* ---------- the stage ---------- */
const cv = $('c'), g = cv.getContext('2d'); let W, H, dpr;
const door = new Image(); door.src = `diya/door_${REGION}.jpg`;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let DIYAS = [], phase = 'dark', t0 = 0, lit0 = -1;
const scratch = document.createElement('canvas'), sg = scratch.getContext('2d'), mask = document.createElement('canvas'), mg = mask.getContext('2d');   // made once, sized in layout()
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = W < 520 ? 7 : 9, y = H * .80, span = Math.min(W * .92, 720);
  DIYAS = Array.from({ length: n }, (_, i) => { const k = i - (n - 1) / 2, d = Math.abs(k); return { x: W / 2 + k / ((n - 1) / 2) * span / 2, y: y + d * d * H * .0035, s: (d ? .74 : 1.05) * Math.min(1, W / 430) * (1 - d * .035), order: d, lit: -1, ph: Math.random() * 9 }; });
  for (const c of [scratch, mask]) { c.width = W; c.height = H; }
}
addEventListener('resize', layout); layout();
const ease = x => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

/* ---------- the painted doorway, revealed by the lamps' light ---------- */
function drawDoor(now) {
  if (!door.complete || !door.naturalWidth) return;
  const z = 1.2 + (phase === 'dark' ? 0 : .04 * ease((now - t0) / 9000));   // a slow push in once the light comes
  const s = Math.max(W / door.width, H / door.height) * z, w = door.width * s, h = door.height * s, x = (W - w) / 2, y = (H - h) / 2 - H * .04;
  const glow = phase === 'dark' ? 0 : ease((now - t0) / 6500);   // the whole doorway warms as the lamps catch
  g.save(); g.globalAlpha = .07 + .5 * glow; g.drawImage(door, x, y, w, h); g.restore();
  // each lit lamp pours light onto the painting around it
  sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, W, H); sg.drawImage(door, x, y, w, h); sg.globalCompositeOperation = 'destination-in';
  mg.clearRect(0, 0, W, H);
  for (const d of DIYAS) if (d.lit >= 0) { const k = ease((now - d.lit) / 1400), R = (H * .32 + H * .5 * glow) * k * d.s; const gr = mg.createRadialGradient(d.x, d.y - 30, 0, d.x, d.y - 30, R);
    gr.addColorStop(0, 'rgba(0,0,0,.95)'); gr.addColorStop(.55, 'rgba(0,0,0,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); mg.fillStyle = gr; mg.fillRect(0, 0, W, H); }
  sg.drawImage(mask, 0, 0); sg.globalCompositeOperation = 'source-over';
  g.save(); g.globalAlpha = .55 + .45 * glow; g.drawImage(scratch, 0, 0); g.restore();
  // warm lamp tint over everything lit, and a night vignette that hides the painting's paper edges
  g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .35 * glow; g.fillStyle = '#ff9a3c'; g.fillRect(0, 0, W, H); g.restore();
  const v = g.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .25, W / 2, H * .55, Math.max(W, H) * .78);
  v.addColorStop(0, 'rgba(11,9,18,0)'); v.addColorStop(1, `rgba(11,9,18,${.92 - .3 * glow})`); g.fillStyle = v; g.fillRect(0, 0, W, H);
  const tb = g.createLinearGradient(0, 0, 0, H * .42); tb.addColorStop(0, 'rgba(11,9,18,.9)'); tb.addColorStop(.55, 'rgba(11,9,18,.55)'); tb.addColorStop(1, 'rgba(11,9,18,0)'); g.fillStyle = tb; g.fillRect(0, 0, W, H * .42);   // the words sit here
  const bb = g.createLinearGradient(0, H * .6, 0, H); bb.addColorStop(0, 'rgba(11,9,18,0)'); bb.addColorStop(1, 'rgba(11,9,18,.9)'); g.fillStyle = bb; g.fillRect(0, H * .6, W, H * .4);
}

/* ---------- a clay diya and its flame ---------- */
function drawDiya(d, now) {
  const s = d.s * 34, x = d.x, y = d.y, lit = d.lit >= 0 ? ease((now - d.lit) / 500) : 0;
  if (lit) {   // its light on the floor and the air
    const R = s * (5 + .4 * Math.sin(now / 130 + d.ph)); const gr = g.createRadialGradient(x, y - s * .9, 0, x, y - s * .9, R);
    gr.addColorStop(0, `rgba(255,190,90,${.42 * lit})`); gr.addColorStop(.4, `rgba(255,140,40,${.16 * lit})`); gr.addColorStop(1, 'rgba(255,120,30,0)');
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(x - R, y - s - R, R * 2, R * 2); g.restore();
  }
  g.save(); g.translate(x, y);
  const body = g.createLinearGradient(0, -s * .2, 0, s * .55); body.addColorStop(0, lit ? '#d9733a' : '#5b2c1a'); body.addColorStop(1, lit ? '#6e2a12' : '#25120b');
  g.fillStyle = body; g.beginPath(); g.moveTo(-s, -s * .12); g.bezierCurveTo(-s * .9, s * .55, s * .9, s * .55, s, -s * .12); g.quadraticCurveTo(s * 1.18, -s * .26, s * 1.32, -s * .5); g.quadraticCurveTo(s * .9, -s * .1, 0, -s * .12); g.closePath(); g.fill();
  g.fillStyle = lit ? '#3b1608' : '#1b0c06'; g.beginPath(); g.ellipse(0, -s * .12, s, s * .2, 0, 0, Math.PI * 2); g.fill();   // the oil
  g.strokeStyle = lit ? 'rgba(255,214,140,.7)' : 'rgba(150,90,60,.35)'; g.lineWidth = Math.max(1, s * .05); g.beginPath(); g.ellipse(0, -s * .12, s, s * .2, 0, Math.PI * .05, Math.PI * .95, true); g.stroke();
  g.fillStyle = lit ? 'rgba(255,236,190,.85)' : 'rgba(160,110,80,.35)'; for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(i * s * .22, s * .2 + Math.abs(i) * -s * .03, s * .045, 0, Math.PI * 2); g.fill(); }   // painted dots
  g.fillStyle = '#2a170c'; g.fillRect(s * 1.05, -s * .62, s * .07, s * .22);   // the wick
  if (lit) {
    const fl = 1 + .12 * Math.sin(now / 90 + d.ph) + .06 * Math.sin(now / 37 + d.ph * 2), sway = Math.sin(now / 210 + d.ph) * s * .08, fx = s * 1.08, fy = -s * .62, fh = s * 1.15 * fl * lit, fw = s * .34;
    g.save(); g.globalCompositeOperation = 'lighter';
    const outer = g.createRadialGradient(fx, fy - fh * .4, 0, fx, fy - fh * .4, fh); outer.addColorStop(0, 'rgba(255,160,50,.55)'); outer.addColorStop(1, 'rgba(255,90,20,0)');
    g.fillStyle = outer; g.beginPath(); g.arc(fx, fy - fh * .4, fh, 0, Math.PI * 2); g.fill();
    const fg = g.createLinearGradient(0, fy, 0, fy - fh); fg.addColorStop(0, 'rgba(255,255,255,.95)'); fg.addColorStop(.35, 'rgba(255,224,120,.95)'); fg.addColorStop(1, 'rgba(255,120,30,0)');
    g.fillStyle = fg; g.beginPath(); g.moveTo(fx - fw, fy); g.quadraticCurveTo(fx - fw * .9, fy - fh * .5, fx + sway, fy - fh); g.quadraticCurveTo(fx + fw * .9, fy - fh * .5, fx + fw, fy); g.quadraticCurveTo(fx, fy + fw * .6, fx - fw, fy); g.fill();
    g.restore();
  }
  g.restore();
}

/* ---------- fireworks, petals, phuljhadi trails ---------- */
const FW = [], TR = [], PT = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), z: .4 + Math.random() * .6, ph: Math.random() * 6, c: ['#f0a12a', '#fff4de', '#d9466f', '#e0861d'][Math.floor(Math.random() * 4)] }));
function drawFireworks(now) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let j = FW.length - 1; j >= 0; j--) { const f = FW[j], q = (now - f.t) / 1000; if (q > 3) { FW.splice(j, 1); continue; }
    const sw = clamp(q / .35), life = 1 - clamp((q - 1.1) / 1.6);
    for (let i = 0; i < f.n; i++) { const a = i / f.n * Math.PI * 2 + f.ph, d = f.R * (1 - Math.exp(-q * 2.6)) * (.8 + .2 * Math.sin(i * 7.3)); const x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d + 26 * q * q;
      g.globalAlpha = sw * life * (.6 + .4 * Math.sin(now / 40 + i)); g.fillStyle = `rgb(${f.c})`; g.beginPath(); g.arc(x, y, 1.8 + 1.4 * (1 - q / 3), 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = .14 * sw * life; const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.R); gr.addColorStop(0, `rgba(${f.c},.9)`); gr.addColorStop(1, `rgba(${f.c},0)`); g.fillStyle = gr; g.fillRect(f.x - f.R, f.y - f.R, f.R * 2, f.R * 2); }
  for (let j = TR.length - 1; j >= 0; j--) { const p = TR[j], q = (now - p.t) / 1000; if (q > 1.6) { TR.splice(j, 1); continue; }   // phuljhadi sparks
    const sx = p.x + p.vx * q * 70, sy = p.y + p.vy * q * 70 + 30 * q * q; g.globalAlpha = 1 - q / 1.6; g.fillStyle = q < .25 ? '#fff' : '#ffcf6a'; g.beginPath(); g.arc(sx, sy, 2.4 * (1 - q / 1.6) + .5, 0, Math.PI * 2); g.fill();
    if (q < .3) { g.globalAlpha = .35 * (1 - q / .3); g.beginPath(); g.arc(p.x, p.y, 14, 0, Math.PI * 2); g.fill(); } }   // the bright head of the phuljhadi
  g.restore();
}
const MOTES = [];
function drawMotes(now) {   // sparks rising from the flames, drifting and fading
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let j = MOTES.length - 1; j >= 0; j--) { const m = MOTES[j], q = (now - m.t) / 1000; if (q > 4) { MOTES.splice(j, 1); continue; }
    const x = m.x + Math.sin(q * 1.6 + m.ph) * 14, y = m.y - q * 70 * m.v, a = (1 - q / 4) * Math.min(1, q * 3);
    const gr = g.createRadialGradient(x, y, 0, x, y, 7); gr.addColorStop(0, `rgba(255,214,140,${.9 * a})`); gr.addColorStop(1, 'rgba(255,160,60,0)'); g.fillStyle = gr; g.fillRect(x - 7, y - 7, 14, 14); }
  g.restore();
}
function drawPetals(now, dt) {
  if (still) return; g.save();
  for (const p of PT) { p.y += dt * (.03 + p.z * .045); p.x += dt * (.012 + .01 * Math.sin(now / 900 + p.ph)); if (p.y > 1.05) { p.y = -.05; p.x = Math.random(); }
    const x = p.x * W, y = p.y * H, r = 4 + p.z * 6, fl = Math.cos(now / 600 + p.ph);
    g.save(); g.translate(x, y); g.rotate(now / 1400 + p.ph); g.scale(.35 + .65 * Math.abs(fl), 1); g.globalAlpha = .7; g.fillStyle = p.c;
    g.beginPath(); g.moveTo(0, r); g.bezierCurveTo(-r * .85, r * .4, -r * .6, -r * .8, 0, -r); g.bezierCurveTo(r * .6, -r * .8, r * .85, r * .4, 0, r); g.fill(); g.restore(); }
  g.restore();
}

/* ---------- sound: soft chimes as each lamp catches (made here), and the flute ---------- */
let ac = null, music = null, muted = false;
function chime(i) {
  if (!ac || muted) return; const f = [523.25, 587.33, 659.25, 783.99, 880, 1046.5][i % 6], t = ac.currentTime;
  [1, 2.01, 3.98].forEach((h, k) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.value = f * h; o.type = 'sine';
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(.12 / (k + 1), t + .01); gn.gain.exponentialRampToValueAtTime(.0001, t + 2.4 / (k + 1)); o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + 2.6); });
}
function startSound() {
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  music = new Audio('../media/music_flute.mp3'); music.loop = true; music.volume = 0; music.play().catch(() => {});
  const up = setInterval(() => { if (!music || music.volume >= .55) return clearInterval(up); music.volume = Math.min(.55, music.volume + .05); }, 200);
  $('mute').classList.add('on');
}
$('mute').onclick = e => { e.stopPropagation(); muted = !muted; if (music) music.muted = muted; $('mute').textContent = muted ? '🔇' : '♪'; };

/* ---------- the story: tap → the first diya → lamp after lamp → the floor art → the greeting → fireworks → a phuljhadi of your own ---------- */
function light(now) {
  if (phase !== 'dark') return; phase = 'lit'; t0 = lit0 = now; startSound();
  $('hint').style.opacity = 0;
  DIYAS.forEach(d => { d.lit = now + d.order * 420; setTimeout(() => chime(d.order), d.order * 420); });
  setTimeout(() => $('top').classList.add('away'), 4600); setTimeout(() => $('greet').classList.add('on'), 5400);
  setTimeout(() => { phase = 'party'; }, 6400);
  setTimeout(() => { $('end').classList.add('on'); $('hint').innerHTML = '<b>Draw with your phuljhadi ✨</b>'; $('hint').style.opacity = 1; setTimeout(() => $('hint').style.opacity = 0, 4200); }, 9500);
}
let drawing = false;
cv.addEventListener('pointerdown', e => {
  const now = performance.now();
  if (phase === 'dark') { light(now); return; }   // a tap anywhere lights it (the hint points at the diya)
  drawing = true; spark(e.clientX, e.clientY, now);
});
cv.addEventListener('pointermove', e => { if (drawing || (phase !== 'dark' && e.pointerType === 'mouse' && e.buttons)) spark(e.clientX, e.clientY, performance.now()); });
addEventListener('pointerup', () => drawing = false);
function spark(x, y, now) { for (let i = 0; i < 11; i++) { const a = Math.random() * Math.PI * 2, v = .3 + Math.random() * .9; TR.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: now }); } if (TR.length > 900) TR.splice(0, TR.length - 900); }
$('again').onclick = () => { phase = 'dark'; lit0 = -1; DIYAS.forEach(d => d.lit = -1); FW.length = 0; $('greet').classList.remove('on'); $('top').classList.remove('away'); $('end').classList.remove('on'); $('hint').innerHTML = '<b>Tap the diya to light it</b>'; $('hint').style.opacity = 1; };

let last = performance.now(), nextFw = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  g.fillStyle = '#0b0912'; g.fillRect(0, 0, W, H);
  drawDoor(now);
  for (const d of DIYAS) drawDiya(d, now);
  if (phase === 'dark') {   // the first diya breathes, waiting for a hand
    const d = DIYAS.find(d => !d.order), k = .5 + .5 * Math.sin(now / 600); const gr = g.createRadialGradient(d.x, d.y, 0, d.x, d.y, 90);
    gr.addColorStop(0, `rgba(255,190,110,${.10 + .08 * k})`); gr.addColorStop(1, 'rgba(255,190,110,0)'); g.fillStyle = gr; g.fillRect(d.x - 90, d.y - 90, 180, 180);
    $('hint').style.top = (d.y + 46) + 'px';
  }
  if (phase !== 'dark' && now > nextFw && !still) { const d = DIYAS[Math.floor(Math.random() * DIYAS.length)]; if (d.lit >= 0 && now > d.lit) MOTES.push({ x: d.x + d.s * 37 + (Math.random() - .5) * 10, y: d.y - d.s * 40, t: now, v: .5 + Math.random() * .8, ph: Math.random() * 6 }); nextFw = now + 90; }
  drawMotes(now);
  drawFireworks(now); if (phase !== 'dark') drawPetals(now, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
